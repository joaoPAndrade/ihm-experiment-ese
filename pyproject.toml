[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ihm-experiment-ese"
version = "0.1.0"
description = "Experimento IHM - ESE: Pesquisa Experimental em Machine Learning e Deep Learning"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "João Pedro de Andrade" }
]
dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
]
